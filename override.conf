[Service]
# Pin Ollama to a specific GPU via the ROCR_VISIBLE_DEVICES env var.
# This is the *physical* HIP device index — check `rocminfo` to find which
# index corresponds to the iGPU you want to use.
#
# On a system with ONE GPU (just the Phoenix iGPU), this is usually 0.
# On a system with an iGPU + an unwanted dGPU, the iGPU index depends on
# PCI ordering — typically the dGPU is 0 and the iGPU is 1.
#
# The model-load runner inherits this env (with patches/03 applied) and
# only ever sees the pinned device. Other GPUs stay reserved for other uses
# (e.g. a discrete GPU for gaming).
Environment="ROCR_VISIBLE_DEVICES=1"

# Bind Ollama's HTTP API to localhost only.
# Change to 0.0.0.0:11434 if you want LAN access (and ideally fronted by
# Tailscale or a similar private overlay network — don't expose to the
# public internet without auth).
Environment="OLLAMA_HOST=127.0.0.1:11434"

# === STABILITY: required ===
# Disable Flash Attention. On Ubuntu 26.04 ROCm 7.1 with the Fedora-sourced
# gfx1103 Tensile kernels, FA code paths trigger SIGABRTs mid-inference.
# Disabling FA costs ~10-15% peak throughput but is the difference between
# "occasionally crashes" and "constantly crashes." Don't enable FA on this
# stack without testing carefully — what looks stable on short prompts
# will fail mid-conversation.
Environment="OLLAMA_FLASH_ATTENTION=0"

# === STABILITY: required to keep crash rate near 1% ===
# Cap context at 16k. The residual gfx11 MES bug returns at higher contexts
# on this hardware even with kernel 7.0.0-15. 16k handles chat and OWUI
# web-search-style RAG comfortably; if you genuinely need 32k+, raise this
# but expect noticeably more frequent crashes.
Environment="OLLAMA_CONTEXT_LENGTH=16384"

# === STABILITY: required to keep crash rate near 1% ===
# Reduce prompt batch size from default 512. Smaller batches dispatch
# smaller compute graphs, which the residual MES susceptibility rarely
# chokes on. ~10-15% prompt-eval speed cost; the difference between ~99%
# and ~50% reliability on long-context prompts.
Environment="OLLAMA_NUM_BATCH=256"

# === STABILITY/PERF: recommended ===
# Keep loaded models resident for 24h instead of the 5-minute default.
# Reloading a 6.6 GB model into iGPU memory takes ~3 seconds even on a
# warm system, and idle gaps of >5 min are common in chat workloads.
# The iGPU isn't doing anything else when idle, so this is free in
# practice. Drop this back to a shorter value (e.g. 30m) if you actually
# need to load multiple different models throughout the day and memory
# pressure becomes an issue.
Environment="OLLAMA_KEEP_ALIVE=24h"

# === STABILITY: recommended on tight iGPU memory budgets ===
# Only one local model resident at a time. Loading two 8B-class models
# at this context size would push 22+ GB of iGPU memory, exceeding the
# 16 GB practical budget on a Phoenix iGPU. If you have spare memory
# (or use cloud models for the second slot), feel free to remove this.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
